server {
    listen 80;
    server_name stockflow.gustavosdaniel.com;

    # Rota exclusiva para o Healthcheck do Docker (Responde 200 OK na hora)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}