server:
  port: 5050

spring:
  application:
    name: stock-flow-api

  r2dbc:
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      max-acquire-time: 10s
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5051}/${POSTGRES_DB:db-stockflow}
    username: ${POSTGRES_USER:gustavo}
    password: ${POSTGRES_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resource server: #
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:5052}/realms/${KEYCLOAK_REALM:stock-flow-realm}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: stockflow-api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.gustavosdaniel.stock_flow_api.messaging.event.*"
inventory:
  kafka:
    topics:
      stock-alerts: stockflow.inventory.alerts.v1

cache:
  ttl:
    default: 1800

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      viacep:
        base-config: default
        sliding-window-type: count_based


keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:5052}
  realm: ${KEYCLOAK_REALM:stock-flow-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:stock-flow-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}


springdoc:
  swagger-ui:
    path: /swagger-ui.html



