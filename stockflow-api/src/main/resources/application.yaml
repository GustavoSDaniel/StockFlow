server:
  port: 6060

spring:
  application:
    name: stock-flow-api

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6061}/${POSTGRES_DB:db-stockflow}
    user: ${POSTGRES_USER:gustavo}
    password: ${POSTGRES_PASSWORD:123456}
    schemas: inventory
    default-schema: inventory
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6061}/${POSTGRES_DB:db_stockflow}?currentSchema=inventory
    username: ${POSTGRES_USER:gustavo}
    password: ${POSTGRES_PASSWORD:123456}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      max-acquire-time: 10s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6070}

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:6062}/realms/${KEYCLOAK_REALM:stock-flow-realm}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:6063}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: stockflow-api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.gustavosdaniel.stock_flow_api.messaging.event"

  api:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

inventory:
  kafka:
    topics:
      stock-alerts: stockflow.inventory.alerts.v1

cache:
  ttl:
    default: 1800

resilience4j:
  circuit breaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      viacep:
        base-config: default
        sliding-window-type: count_based

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers
  endpoint:
    health:
      show-details: when-authorized
    Prometheus:
      enabled: true
  metrics:
    tags:
      application: stockflow
      environment: ${ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:6068/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

