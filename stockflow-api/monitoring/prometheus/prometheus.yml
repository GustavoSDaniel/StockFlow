global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'stockflow-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['stockflow-api:6060']
        labels:
          application: 'stockflow'