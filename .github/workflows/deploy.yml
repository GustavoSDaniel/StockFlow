name: CI/CD Pipeline - StockFlow API

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: stockflow-api/pom.xml

      - name: Rodar testes
        working-directory: ./stockflow-api
        run: mvn clean test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir e Enviar Imagem para o Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./stockflow-api
          file: ./stockflow-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            gustavosdaniel/stockflow-api:latest
            gustavosdaniel/stockflow-api:${{ github.sha }}
          cache-from: type=registry,ref=gustavosdaniel/stockflow-api:buildcache
          cache-to: type=registry,ref=gustavosdaniel/stockflow-api:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/infra/ec2
            docker compose pull stockflow-api
            docker compose up -d --no-deps stockflow-api
            docker image prune -f